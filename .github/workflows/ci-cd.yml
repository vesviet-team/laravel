name: CI/CD Pipeline

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────────────────────
  # Stage 1: Quality Gate & Architectural Fitness
  # ──────────────────────────────────────────────────────────────
  lint:
    name: Code Quality & Architectural Fitness
    runs-on: [self-hosted, linux, x64, docker]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP for Quality Checks
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check Code Style (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: '[ADR-S4] Enforce ADR-S2: DB::transaction only in app/Actions/'
        run: |
          echo "=== ADR-S2: Transaction Boundary Fitness Function ==="
          echo "Rule: DB::transaction() and DB::beginTransaction() MUST only appear in app/Actions/"
          echo "      Any occurrence outside app/Actions/ is an architectural violation."
          echo ""

          VIOLATIONS=$(grep -rn "DB::transaction\|DB::beginTransaction\|DB::commit\|DB::rollBack" \
            --include="*.php" app/ \
            | grep -v "^app/Actions/" \
            | grep -v "// ADR-S2: exception allowed" \
            | grep -v "# ADR-S2: exception allowed" \
            || true)

          if [ -n "$VIOLATIONS" ]; then
            echo "❌ ADR-S2 VIOLATION: DB::transaction found outside app/Actions/"
            echo ""
            echo "$VIOLATIONS"
            echo ""
            echo "Fix: Move transaction management into an Action class."
            echo "     If this is intentional, add '// ADR-S2: exception allowed' comment."
            exit 1
          fi
          echo "✅ ADR-S2 PASS: All transaction boundaries are within app/Actions/"

      - name: '[ADR-S3] Secret Scanner: detect committed secrets'
        run: |
          echo "=== ADR-S3: Secret Scanner ==="
          echo "Rule: No real APP_KEY values, API tokens, or passwords should be committed."
          echo ""

          # Check for committed .env with real content (not .env.example)
          if git ls-files | grep -q "^\.env$"; then
            echo "❌ ADR-S3 VIOLATION: .env file is tracked by git."
            echo "   Run: git rm --cached .env && git commit -m 'fix: remove .env from git tracking'"
            exit 1
          fi

          # Check for committed sqlite files
          if git ls-files | grep -qE "database/.*\.sqlite"; then
            echo "❌ ADR-S3 VIOLATION: SQLite database file is tracked by git (contains PII risk)."
            echo "   Run: git rm --cached database/*.sqlite && git commit -m 'fix: remove sqlite from git tracking'"
            exit 1
          fi

          # Check for real-looking APP_KEY values in tracked PHP/env files
          HARDCODED_KEYS=$(git ls-files '*.php' '*.env*' 'config/*.php' \
            | xargs grep -l "APP_KEY=base64:" 2>/dev/null \
            | grep -v ".env.example" \
            | grep -v ".gitignore" \
            || true)

          if [ -n "$HARDCODED_KEYS" ]; then
            echo "❌ ADR-S3 VIOLATION: APP_KEY value found in tracked file(s):"
            echo "$HARDCODED_KEYS"
            exit 1
          fi

          # Check for hardcoded GOSHIP or other API tokens in PHP code
          HARDCODED_TOKENS=$(grep -rn "GOSHIP_TOKEN\s*=\s*['\"][^'\"]\+['\"]" \
            --include="*.php" app/ config/ \
            | grep -v "env(" \
            | grep -v "//" \
            || true)

          if [ -n "$HARDCODED_TOKENS" ]; then
            echo "❌ ADR-S3 VIOLATION: Hardcoded API token found (use env() instead):"
            echo "$HARDCODED_TOKENS"
            exit 1
          fi

          echo "✅ ADR-S3 PASS: No secrets detected in tracked files"

      - name: '[ADR-S3] Structural Trust Zone: Verify Restricted zone file patterns'
        run: |
          echo "=== ADR-S3: Restricted Zone Integrity ==="
          echo "Rule: Auth config, payment-adjacent code, and encryption keys"
          echo "      must not contain hardcoded credential values."
          echo ""

          # No hardcoded passwords in config/ files
          CONFIG_SECRETS=$(grep -rn "password\s*=>\s*['\"][^'\"]" \
            --include="*.php" config/ \
            | grep -v "env(" \
            | grep -v "//" \
            | grep -v "'password' => ''" \
            || true)

          if [ -n "$CONFIG_SECRETS" ]; then
            echo "❌ ADR-S3 VIOLATION: Possible hardcoded credential in config/:"
            echo "$CONFIG_SECRETS"
            exit 1
          fi

          echo "✅ ADR-S3 PASS: Restricted zone config files look clean"

      - name: '[ADR-S5] Vite Manifest Integrity: every viteTheme() entry must be built'
        run: |
          echo "=== ADR-S5: Vite Manifest Coverage ==="
          echo "Rule: Every CSS/JS path passed to viteTheme() or referenced by"
          echo "      FilamentView::registerRenderHook() must be registered in"
          echo "      vite.config.js input array, so the build produces a manifest entry."
          echo ""

          # Extract theme paths from PHP source
          THEME_PATHS=$(grep -rn "viteTheme\|registerRenderHook" \
            --include="*.php" app/ \
            | grep -oE "['\"][^'\"]*\.css['\"]" \
            | tr -d "'\"" \
            | grep -v "seller-panel.css" \
            | grep -v "seller-theme.css" \
            | sort -u \
            || true)

          if [ -z "$THEME_PATHS" ]; then
            echo "✅ ADR-S5 PASS: No viteTheme() calls found, nothing to verify"
            exit 0
          fi

          echo "Found viteTheme references:"
          echo "$THEME_PATHS"
          echo ""

          MISSING=0
          for path in $THEME_PATHS; do
            # Match either single or double quoted form by substring
            if grep -qF "$path" vite.config.js 2>/dev/null; then
              echo "  ✓ $path (registered in vite.config.js)"
            else
              echo "  ❌ $path NOT registered in vite.config.js input array"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo ""
            echo "❌ ADR-S5 VIOLATION: $MISSING theme file(s) not in vite.config.js"
            echo "Fix: Add the missing CSS file to vite.config.js 'input' array,"
            echo "     then run 'npm run build' to regenerate public/build/manifest.json"
            echo "     (Failure to do so will cause 500 errors in production, which"
            echo "     some reverse proxies surface as 403 Forbidden to clients.)"
            exit 1
          fi

          echo "✅ ADR-S5 PASS: All viteTheme paths are registered in vite.config.js"

  # ──────────────────────────────────────────────────────────────
  # Stage 2: Automated Testing (Pest / PHPUnit)
  # ──────────────────────────────────────────────────────────────
  test:
    name: Run Tests (Isolated SQLite In-Memory)
    runs-on: [self-hosted, linux, x64, docker]
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Tests (Pest/PHPUnit)
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  # ──────────────────────────────────────────────────────────────
  # Stage 3: Container Image Build & Security Scan
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build and Push Docker Image
    runs-on: [self-hosted, linux, x64, docker]
    needs: test
    if: github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.vars.outputs.short_sha }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute Short SHA
        id: vars
        run: echo "short_sha=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js for Asset Compilation
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Build Frontend Assets (Vite)
        run: |
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/vesviet-team/laravel:${{ steps.vars.outputs.short_sha }}
            ghcr.io/vesviet-team/laravel:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/vesviet-team/laravel:main
          format: spdx-json
          output-file: sbom.spdx.json

      - name: '[SCA] Scan SBOM for vulnerabilities (blocks on critical/high CVEs)'
        uses: anchore/scan-action@v5
        with:
          sbom: sbom.spdx.json
          fail-build: false
          severity-cutoff: high
          output-format: table

  # ──────────────────────────────────────────────────────────────
  # Stage 4: GitOps Deployment Notification / Trigger
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: GitOps Write-Back Deploy
    runs-on: [self-hosted, linux, x64, docker]
    needs: [build]
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: vesviet-team/gitops
          token: ${{ secrets.GITOPS_PUSH_TOKEN }}
          path: gitops

      - name: Install Kustomize
        run: |
          mkdir -p bin
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s -- 5.4.3 bin
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Update Laravel Image Tag
        working-directory: gitops/apps/laravel
        run: |
          kustomize edit set image ghcr.io/vesviet-team/laravel=ghcr.io/vesviet-team/laravel:${{ needs.build.outputs.image_tag }}

      - name: Commit and Push with Retry
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/laravel/kustomization.yaml
          git commit -m "chore(deploy): bump laravel to ${{ needs.build.outputs.image_tag }} [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break || sleep $((i * 2))
          done
